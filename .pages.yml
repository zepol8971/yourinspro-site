media:
  input: assets
  output: assets
content:
  - name: site
    label: Website text and photos
    type: file
    path: content/site.json
    fields:
      - name: hero_headline
        label: Main headline (top of the page)
        type: string
      - name: hero_lead
        label: Sentence under the headline
        type: text
      - name: carriers
        label: Carriers line (example "20+ carriers")
        type: string
      - name: carriers_note
        label: Carrier names under that line
        type: string
      - name: phone
        label: Phone number
        type: string
      - name: quote_email
        label: Email address (quote requests go here)
        type: string
      - name: address
        label: Address (city and state is fine)
        type: string
      - name: hours
        label: Hours
        type: string
      - name: policyholder_url
        label: Current policyholder button link (full web address)
        type: string
      - name: facebook_url
        label: Facebook page link (full web address; leave empty to hide the icon)
        type: string
      - name: instagram_url
        label: Instagram link (full web address; leave empty to hide the icon)
        type: string
      - name: linkedin_url
        label: LinkedIn page link (full web address; leave empty to hide the icon)
        type: string
      - name: story_title
        label: About section title
        type: string
      - name: story_text
        label: About section text
        type: text
      - name: hero_photo
        label: Big photo at the top of the page
        type: image
      - name: hero_focus
        label: Top photo - which part shows in the circle (example 50% 50%; first number moves left to right, second up to down)
        type: string
      - name: portrait_photo
        label: Your portrait (About section)
        type: image
      - name: portrait_focus
        label: Portrait - which part shows in the circle (example 41% 50%)
        type: string
